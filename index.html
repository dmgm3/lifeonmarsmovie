<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="description" content="Life on M.A.R.S. — a short documentary coming in 2027.">
<title>Life on M.A.R.S. | Coming in 2027</title>
<style>
:root{color-scheme:dark;--cream:#f7e9c9;--red:#ff2418}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--cream);font-family:Arial,Helvetica,sans-serif}
body{overflow:hidden}.page{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:clamp(14px,3vh,34px) 22px max(22px,env(safe-area-inset-bottom));gap:clamp(10px,3vh,26px)}
main{min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,5vh,52px)}
.logo-stage{position:relative;width:min(90vw,1100px);aspect-ratio:1862/786;max-height:min(56dvh,560px);cursor:pointer;isolation:isolate;outline-offset:9px;flex-shrink:1}
.logo{display:block;width:100%;height:100%;object-fit:contain;transition:opacity .5s ease}
.video-mask{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;pointer-events:none;-webkit-mask:url('logo-mask.webp') center / 100% 100% no-repeat;mask:url('logo-mask.webp') center / 100% 100% no-repeat}
.video-mask video{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.logo-stage.active .logo{opacity:0}.logo-stage.active .video-mask{opacity:1}
.logo-stage:focus-visible{outline:2px solid var(--cream)}
.announcement{text-align:center;line-height:1.5;text-transform:uppercase;letter-spacing:clamp(2px,.42vw,6px);font-size:clamp(10px,1.5vw,15px);font-weight:600}
.announcement .year{display:block;margin-top:4px;color:var(--cream);font-size:clamp(13px,2vw,20px);letter-spacing:clamp(3px,.6vw,9px)}
footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(20px,5vw,56px);padding-bottom:2px}
footer a{display:inline-flex;align-items:center;gap:9px;color:var(--cream);text-decoration:none;text-transform:uppercase;letter-spacing:1.8px;font-size:11px;transition:color .2s ease}
footer a:hover,footer a:focus-visible{color:var(--red)}footer svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-height:520px){.page{padding-top:8px;padding-bottom:max(9px,env(safe-area-inset-bottom));gap:5px}.logo-stage{max-height:47dvh}.announcement{font-size:10px;line-height:1.25}.announcement .year{font-size:12px;margin-top:2px}footer a{font-size:10px}}
@media(max-width:420px){.page{padding-left:12px;padding-right:12px}footer{gap:17px}footer a{font-size:10px;letter-spacing:1px;gap:5px}footer svg{width:17px;height:17px}}
</style>
</head>
<body><div class="page"><main>
<div class="logo-stage" id="logoStage" role="button" tabindex="0" aria-label="Play a silent preview of Matt inside the Life on M.A.R.S. title" aria-pressed="false">
<img class="logo" src="logo.webp" alt="Life on M.A.R.S." width="1862" height="786">
<div class="video-mask" aria-hidden="true"><video id="mattVideo" muted playsinline loop preload="none" disablepictureinpicture></video></div>
</div>
<div class="announcement">A short documentary<span class="year">Coming in 2027</span></div>
</main><footer aria-label="Connect">
<a href="https://www.youtube.com/@OptD-films" target="_blank" rel="noopener noreferrer" aria-label="Option D Films on YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg>YouTube</a>
<a href="https://www.instagram.com/optiondfilms/" target="_blank" rel="noopener noreferrer" aria-label="Option D Films on Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"/></svg>Instagram</a>

<a href="mailto:david@optiondfilms.com" aria-label="Send email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg>Email</a>
</footer></div>
<script>
(()=>{
const stage=document.getElementById('logoStage'),video=document.getElementById('mattVideo');
const touch=window.matchMedia('(hover: none)').matches;
let loaded=false;
function activate(){
 if(!loaded){const source=document.createElement('source');source.src='matt-preview.mp4';source.type='video/mp4';video.appendChild(source);video.load();loaded=true;}
 stage.classList.add('active');stage.setAttribute('aria-pressed','true');
 const p=video.play();if(p&&p.catch)p.catch(()=>{stage.classList.remove('active');stage.setAttribute('aria-pressed','false');});
}
function deactivate(){stage.classList.remove('active');stage.setAttribute('aria-pressed','false');video.pause();video.currentTime=0;}
if(!touch){stage.addEventListener('pointerenter',activate);stage.addEventListener('pointerleave',deactivate);}
stage.addEventListener('click',()=>{if(stage.classList.contains('active'))deactivate();else activate();});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();stage.click();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)deactivate();});
})();
</script></body></html>
